name: rota-ti

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rotati
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Manaus
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/mysql/02-seed-perguntas.sql:/docker-entrypoint-initdb.d/02-seed-perguntas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: rotati
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: DISABLED
      APP_URL_BASE: ${APP_URL_BASE}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      H2_CONSOLE_ENABLED: "false"
      THYMELEAF_CACHE: "true"
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_EMAIL_REMETENTE: ${APP_EMAIL_REMETENTE:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8080}:8080"
    networks:
      - frontend
      - backend

volumes:
  mysql_data:

networks:
  frontend:
  backend:
    internal: true
